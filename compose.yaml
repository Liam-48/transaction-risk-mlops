
services:
  mlflow:
    build: .
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --artifacts-destination /app/mlartifacts
      --host 0.0.0.0
      --port 5000
      --workers 1
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/bank-fraud-risk@champion
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
